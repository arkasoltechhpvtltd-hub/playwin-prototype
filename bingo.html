<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayWin — Bingo</title>
<style>
  :root{--bg:#eef0f4;--card:#fff;--border:#e3e5ea;--text:#1c1e26;--muted:#6b6f7a;
    --accent:#4f46e5;--accent-bg:#eceafd;--accent-text:#4338ca;--won:#187a3d;--won-bg:#e7f6ec;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px;}
  .wrap{width:100%;max-width:400px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  a.back{color:var(--accent-text);text-decoration:none;font-size:14px;font-weight:500;}
  .btn{font-size:13px;font-weight:500;padding:8px 14px;border-radius:9px;border:1px solid var(--border);
    background:var(--card);color:var(--text);cursor:pointer;}
  .caller{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;
    text-align:center;margin-bottom:14px;}
  .called-num{font-size:44px;font-weight:700;color:var(--accent-text);line-height:1;}
  .called-list{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;word-break:break-word;}
  .call-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px;
    font-size:15px;font-weight:500;margin-top:12px;cursor:pointer;}
  .call-btn:disabled{opacity:.5;cursor:default;}
  .win-banner{background:var(--won-bg);color:var(--won);border-radius:12px;padding:12px 14px;
    font-size:14px;font-weight:600;margin-bottom:12px;display:none;text-align:center;}
  .headrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px;}
  .headrow div{text-align:center;font-weight:700;color:var(--accent);font-size:15px;}
  .card{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--card);
    border:1px solid var(--border);border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:.1s;}
  .cell.free{background:var(--accent-bg);color:var(--accent-text);cursor:default;}
  .cell.marked{background:var(--won-bg);color:var(--won);border-color:var(--won);}
  .cell.missed{animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .foot{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../index.html">← PlayWin</a>
    <button class="btn" onclick="reset()">New card</button></div>
  <div class="win-banner" id="win"></div>
  <div class="caller">
    <div class="called-num" id="num">—</div>
    <div class="called-list" id="list">Press Call number to begin</div>
    <button class="call-btn" id="call" onclick="call()">Call number</button>
  </div>
  <div class="headrow"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
  <div class="card" id="card"></div>
  <div class="foot">Numbers are called at random. Tap a number on your card when it's called. Complete any full line — row, column, or diagonal — to win a coupon.</div>
</div>
<script>
const ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
let grid, marked, called, pool, over;
const cardEl=document.getElementById('card');

function reset(){
  grid=[]; marked=[];
  for(let c=0;c<5;c++){
    const [lo,hi]=ranges[c]; const nums=[];
    while(nums.length<5){ const n=lo+Math.floor(Math.random()*(hi-lo+1)); if(!nums.includes(n))nums.push(n); }
    grid.push(nums);
  }
  marked=Array.from({length:5},()=>Array(5).fill(false));
  marked[2][2]=true; // free centre
  called=[]; pool=[]; for(let n=1;n<=75;n++)pool.push(n); over=false;
  document.getElementById('win').style.display='none';
  document.getElementById('num').textContent='—';
  document.getElementById('list').textContent='Press Call number to begin';
  document.getElementById('call').disabled=false;
  render();
}
function render(){
  cardEl.innerHTML='';
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){
    const d=document.createElement('div');
    const free = r===2&&c===2;
    d.className='cell'+(free?' free':'')+(marked[r][c]&&!free?' marked':'');
    d.textContent = free?'★':grid[c][r];
    if(!free) d.onclick=()=>daub(r,c,d);
    cardEl.appendChild(d);
  }
}
function call(){
  if(over||!pool.length)return;
  const i=Math.floor(Math.random()*pool.length);
  const n=pool.splice(i,1)[0]; called.push(n);
  document.getElementById('num').textContent=n;
  document.getElementById('list').textContent='Called: '+called.slice().sort((a,b)=>a-b).join(', ');
  if(!pool.length) document.getElementById('call').disabled=true;
}
function daub(r,c,el){
  if(over)return;
  const n=grid[c][r];
  if(called.includes(n)){ marked[r][c]=true; el.className='cell marked'; el.textContent=n; checkWin(); }
  else { el.classList.add('missed'); setTimeout(()=>el.classList.remove('missed'),300); }
}
function checkWin(){
  const line=n=>n.every(([r,c])=>marked[r][c]);
  for(let r=0;r<5;r++) if(line([...Array(5)].map((_,c)=>[r,c]))) return win('row');
  for(let c=0;c<5;c++) if(line([...Array(5)].map((_,r)=>[r,c]))) return win('column');
  if(line([...Array(5)].map((_,i)=>[i,i]))) return win('diagonal');
  if(line([...Array(5)].map((_,i)=>[i,4-i]))) return win('diagonal');
}
function win(kind){
  over=true;
  const w=document.getElementById('win'); w.style.display='block';
  w.textContent='🏆 Bingo! Completed a '+kind+' — a coupon would be granted here.';
}
reset();
</script>
</body>
</html>
