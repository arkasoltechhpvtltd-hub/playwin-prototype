<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayWin — Connect 4</title>
<style>
  :root{--bg:#eef0f4;--card:#fff;--border:#e3e5ea;--text:#1c1e26;--muted:#6b6f7a;
    --accent:#4f46e5;--accent-bg:#eceafd;--accent-text:#4338ca;--p1:#4f46e5;--p2:#e8792b;
    --won:#187a3d;--won-bg:#e7f6ec;--board:#2b3a67;--hole:#dfe3ee;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px;}
  .wrap{width:100%;max-width:460px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  a.back{color:var(--accent-text);text-decoration:none;font-size:14px;font-weight:500;}
  .btn{font-size:13px;font-weight:500;padding:8px 14px;border-radius:9px;border:1px solid var(--border);
    background:var(--card);color:var(--text);cursor:pointer;}
  .btn:hover{background:#f4f5f8;}
  h1{font-size:20px;margin:0 0 4px;}
  .turn{font-size:14px;font-weight:600;padding:8px 14px;border-radius:20px;background:var(--card);
    border:1px solid var(--border);display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .win-banner{background:var(--won-bg);color:var(--won);border-radius:12px;padding:12px 14px;
    font-size:14px;font-weight:600;margin-bottom:12px;display:none;}
  .board{background:var(--board);border-radius:16px;padding:10px;display:grid;
    grid-template-columns:repeat(7,1fr);gap:8px;box-shadow:0 10px 30px rgba(20,22,30,.16);}
  .cell{aspect-ratio:1;background:var(--hole);border-radius:50%;cursor:pointer;transition:transform .08s;}
  .cell:hover{transform:scale(1.05);}
  .cell.p1{background:var(--p1);}
  .cell.p2{background:var(--p2);}
  .foot{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../index.html">← PlayWin</a>
    <button class="btn" onclick="reset()">New game</button></div>
  <h1>Connect 4</h1>
  <div class="turn" id="turn"><span class="dot" style="background:var(--p1)"></span>Player 1's turn</div>
  <div class="win-banner" id="win"></div>
  <div class="board" id="board"></div>
  <div class="foot">Two players take turns. Tap a column to drop your disc. Get four in a row — across, down, or diagonally — to win a coupon.</div>
</div>
<script>
const ROWS=6, COLS=7;
let board, current, over;
const boardEl=document.getElementById('board');

function reset(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  current=1; over=false;
  document.getElementById('win').style.display='none';
  render(); updateTurn();
}
function render(){
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='cell'+(board[r][c]===1?' p1':board[r][c]===2?' p2':'');
    d.onclick=()=>drop(c);
    boardEl.appendChild(d);
  }
}
function drop(c){
  if(over) return;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r][c]===0){ board[r][c]=current; render();
      if(wins(r,c)){ return win(); }
      if(board.every(row=>row.every(v=>v))){ return draw(); }
      current=current===1?2:1; updateTurn(); return;
    }
  }
}
function wins(r,c){
  const p=board[r][c];
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    let n=1;
    for(let s=1;s<4;s++){const rr=r+dr*s,cc=c+dc*s;if(rr<0||rr>=ROWS||cc<0||cc>=COLS||board[rr][cc]!==p)break;n++;}
    for(let s=1;s<4;s++){const rr=r-dr*s,cc=c-dc*s;if(rr<0||rr>=ROWS||cc<0||cc>=COLS||board[rr][cc]!==p)break;n++;}
    if(n>=4) return true;
  }
  return false;
}
function updateTurn(){
  const t=document.getElementById('turn');
  const col=current===1?'var(--p1)':'var(--p2)';
  t.innerHTML='<span class="dot" style="background:'+col+'"></span>Player '+current+"'s turn";
}
function win(){
  over=true;
  const w=document.getElementById('win');
  w.style.display='block';
  w.textContent='🏆 Player '+current+' wins! A coupon would be granted here.';
}
function draw(){
  over=true;
  const w=document.getElementById('win');
  w.style.display='block'; w.style.color='var(--muted)'; w.style.background='#f0f0f4';
  w.textContent="It's a draw — board full. Tap New game.";
}
reset();
</script>
</body>
</html>
